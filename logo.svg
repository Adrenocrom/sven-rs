<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="sven-logo-title">
  <title id="sven-logo-title">sven — a terminal coding agent for local LLMs</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2030"/>
      <stop offset="1" stop-color="#0c0e15"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12151f"/>
      <stop offset="1" stop-color="#0d1018"/>
    </linearGradient>
  </defs>

  <!-- rounded-square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- terminal window -->
  <rect x="76" y="120" width="360" height="272" rx="28" fill="url(#screen)" stroke="#39415a" stroke-width="2"/>

  <!-- window header: traffic lights + divider -->
  <circle cx="108" cy="148" r="9" fill="#ff5f57"/>
  <circle cx="136" cy="148" r="9" fill="#febc2e"/>
  <circle cx="164" cy="148" r="9" fill="#28c840"/>
  <line x1="78" y1="176" x2="434" y2="176" stroke="#39415a" stroke-width="2"/>

  <!-- the ">> " prompt, drawn as chevrons so no font is needed -->
  <g fill="none" stroke="#4ade80" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 232 L200 284 L150 336"/>
    <path d="M230 232 L280 284 L230 336"/>
  </g>

  <!-- block cursor -->
  <rect x="330" y="244" width="48" height="80" rx="10" fill="#fbbf24"/>
</svg>